<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>个人作品集 | Johnjiang2016</title>
        <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Microsoft YaHei,sans-serif;background:#f5f7fa;padding:40px 20px;}
        .container{max-width:1000px;margin:0 auto;}
        h1{text-align:center;color:#222;margin-bottom:10px;}
        .desc{text-align:center;color:#666;margin-bottom:40px;}
        .work-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
        .work-item{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px #00000015;}
        .work-item img{width:100%;height:auto;display:block;}
        .center{display:flex;justify-content:center;align-items:center;}
    </style>
    </head>
    <body>
        <div class="container">
            <h1>个人项目作品集</h1>
            <p class="desc">前端 / 项目作品展示</p>
            <h3 class="center">LowCode平台</h3>
            <div class="work-list">
                <div class="work-item"><img src="lowcode-1.png" alt="低代码1"></div>
                <div class="work-item"><img src="lowcode-2.png" alt="低代码2"></div>
                <div class="work-item"><img src="lowcode-3.png" alt="低代码3"></div>
                <div class="work-item"><img src="lowcode-4.png" alt="低代码4"></div>
                <div class="work-item"><img src="lowcode-5.png" alt="低代码5"></div>
                <div class="work-item"><img src="lowcode-6.png" alt="低代码6"></div>
                <div class="work-item"><img src="lowcode-7.png" alt="低代码7"></div>
                <div class="work-item"><img src="lowcode-8.png" alt="低代码8"></div>
                <div class="work-item"><img src="lowcode-9.png" alt="低代码9"></div>
            </div>
            <h3 class="center">跨平台期货交易终端(⽀持：macOS、Windows、Linux)</h3>
            <div class="work-list"></div>
                <div class="work-item"><img src="trading-client-1.png" alt="期货交易终端1"></div>
                <div class="work-item"><img src="trading-client-2.png" alt="期货交易终端2"></div>
                <div class="work-item"><img src="trading-client-3.png" alt="期货交易终端3"></div>
                <div class="work-item"><img src="trading-client-4.png" alt="期货交易终端4"></div>
                <div class="work-item"><img src="trading-client-5.png" alt="期货交易终端5"></div>
                <div class="work-item"><img src="trading-client-6.png" alt="期货交易终端6"></div>
            </div>
            <h3 class="center">ZNO 相册编辑器</h3>
            <div class="work-list">
                <div class="work-item"><img src="photo-album-1.png" alt="ZNO 相册编辑器1"></div>
                <div class="work-item"><img src="photo-album-2.png" alt="ZNO 相册编辑器2"></div>
                <div class="work-item"><img src="photo-album-3.png" alt="ZNO 相册编辑器3"></div>
                <div class="work-item"><img src="photo-album-4.png" alt="ZNO 相册编辑器4"></div>
                <div class="work-item"><img src="photo-album-5.png" alt="ZNO 相册编辑器5"></div>
            </div>
        </div>
    </body>
</html>

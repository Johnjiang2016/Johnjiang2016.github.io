<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人作品集 | Johnjiang2016</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Microsoft YaHei,sans-serif;background:#f5f7fa;padding:40px 20px;}
        .container{max-width:1000px;margin:0 auto;}
        h1{text-align:center;color:#222;margin-bottom:10px;}
        .desc{text-align:center;color:#666;margin-bottom:40px;}
        .work-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
        .work-item{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px #00000015;}
        .work-item img{width:100%;height:auto;display:block;}
    </style>
</head>
<body>
    <div class="container">
        <h1>个人项目作品集</h1>
        <p class="desc">前端 / 项目作品展示</p>
        <div class="work-list">
            <!-- 在这里替换你的图片文件名 -->
            <div class="work-item"><img src="work1.jpg" alt="作品1"></div>
            <div class="work-item"><img src="work2.jpg" alt="作品2"></div>
            <div class="work-item"><img src="work3.jpg" alt="作品3"></div>
        </div>
    </div>
</body>
</html>
